name: Publish Android images

on:
  push:
    branches:
      - main
    paths:
      - sdk/**
      - versions.yml
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild without using the Docker cache
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish:
    concurrency:
      group: publish-android-images
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read Android versions
        id: versions
        run: |
          ruby -ryaml -e '
            YAML.load_file("versions.yml").fetch("android_sdk").each do |key, value|
              File.open(ENV.fetch("GITHUB_OUTPUT"), "a") { |output| output.puts "#{key}=#{value}" }
            end
          '

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/android-sdk" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The SDK and NDK targets still use the internal `tools` Docker stage.
      # Uncomment this step if a standalone `:tools` image is needed again.
      # - name: Build and push tools image
      #   uses: docker/build-push-action@v7
      #   with:
      #     context: sdk
      #     target: tools
      #     platforms: linux/amd64
      #     push: true
      #     tags: |
      #       ${{ steps.image.outputs.name }}:tools
      #       ${{ steps.image.outputs.name }}:tools-${{ steps.versions.outputs.command_line_tools }}
      #     no-cache: ${{ inputs.force_rebuild == true }}
      #     cache-from: type=gha,scope=android-tools
      #     cache-to: type=gha,mode=max,scope=android-tools
      #     build-args: |
      #       command_line_tools=${{ steps.versions.outputs.command_line_tools }}
      #       command_line_tools_sha1=${{ steps.versions.outputs.command_line_tools_sha1 }}

      - name: Build and push SDK image
        uses: docker/build-push-action@v7
        with:
          context: sdk
          target: sdk
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.versions.outputs.platform }}
            ${{ steps.image.outputs.name }}:latest
          no-cache: ${{ inputs.force_rebuild == true }}
          cache-from: type=gha,scope=android-sdk
          cache-to: type=gha,mode=max,scope=android-sdk
          build-args: |
            command_line_tools=${{ steps.versions.outputs.command_line_tools }}
            command_line_tools_sha1=${{ steps.versions.outputs.command_line_tools_sha1 }}
            android_platform=${{ steps.versions.outputs.platform }}
            android_build_tools=${{ steps.versions.outputs.build_tools }}

      - name: Build and push SDK with NDK image
        uses: docker/build-push-action@v7
        with:
          context: sdk
          target: ndk
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.versions.outputs.platform }}-ndk
            ${{ steps.image.outputs.name }}:latest-ndk
          no-cache: ${{ inputs.force_rebuild == true }}
          cache-from: type=gha,scope=android-ndk
          cache-to: type=gha,mode=max,scope=android-ndk
          build-args: |
            command_line_tools=${{ steps.versions.outputs.command_line_tools }}
            command_line_tools_sha1=${{ steps.versions.outputs.command_line_tools_sha1 }}
            android_platform=${{ steps.versions.outputs.platform }}
            android_build_tools=${{ steps.versions.outputs.build_tools }}
            android_ndk=${{ steps.versions.outputs.ndk }}
